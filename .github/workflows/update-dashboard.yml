name: 📊 Auto-Update Dashboard

on:
  schedule:
    # Runs at 08:00 UTC on the 25th of every month.
    # By the 25th all key series are published:
    #   CPI & PPI      → released ~2nd week
    #   JOLTS & M2     → released ~3rd–4th week
    #   Sahm / Claims  → weekly, always current
    #   FRED sync      → usually within 1 business day of source release
    - cron: '0 8 25 * *'

  # Also lets you trigger a manual run any time from:
  # GitHub → your repo → Actions → "Auto-Update Dashboard" → Run workflow
  workflow_dispatch:

jobs:
  update:
    name: Fetch FRED data and patch HTML
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to commit back to the repo

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run dashboard updater
        env:
          # Store your FRED key as a repo secret:
          # GitHub → repo → Settings → Secrets → Actions → New secret
          # Name: FRED_API_KEY   Value: 68cb1c667bbe364dc0f7e64c8e1283ae
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage whichever filename you use
          git add cycle-navigator.html economic-cycle-dashboard.html index.html 2>/dev/null || true

          # Only commit if something actually changed — avoids empty commits
          if git diff --cached --quiet; then
            echo "No changes to commit — data unchanged since last run."
          else
            MONTH=$(date +'%B %Y')
            git commit -m "📊 Auto-update: FRED data refresh — ${MONTH}"
            git push
            echo "✓ Committed and pushed."
          fi
